<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthCheck - Theo Dõi Sức Khỏe</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #0284c7;
            /* Sky 600 */
            --danger: #ef4444;
            /* Red 500 */
            --success: #22c55e;
            /* Green 500 */
            --warning: #eab308;
            /* Yellow 500 */
            --bg: #f0f9ff;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: var(--bg);
            color: #334155;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }

        h2 {
            margin-top: 0;
            color: var(--primary);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 500;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #64748b;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--primary);
            outline: none;
        }

        .btn-check {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--primary), #0369a1);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(2, 132, 199, 0.3);
            transition: 0.3s;
        }

        .btn-check:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px rgba(2, 132, 199, 0.4);
        }

        .result-metric {
            text-align: center;
            margin-bottom: 30px;
        }

        .bmi-value {
            font-size: 4rem;
            font-weight: 800;
            color: var(--primary);
            line-height: 1;
        }

        .bmi-label {
            font-size: 1.2rem;
            font-weight: 500;
            color: #64748b;
            margin-top: 5px;
        }

        .status-badge {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 50px;
            font-weight: 700;
            margin-top: 10px;
            color: white;
        }

        .gauge-container {
            height: 20px;
            background: #e2e8f0;
            border-radius: 10px;
            margin: 20px 0;
            position: relative;
            overflow: hidden;
        }

        .gauge-bar {
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            transition: width 1s ease;
        }

        .gauge-ue {
            background: #3b82f6;
            width: 18.5%;
        }

        /* Underweight */
        .gauge-nm {
            background: #22c55e;
            width: 22.9%;
            left: 18.5%;
        }

        /* Normal */
        .gauge-ow {
            background: #eab308;
            width: 20%;
            left: 41.4%;
        }

        /* Overweight */
        .gauge-ob {
            background: #ef4444;
            width: 40%;
            left: 61.4%;
        }

        /* Obese */

        .marker {
            position: absolute;
            top: -5px;
            width: 4px;
            height: 30px;
            background: black;
            transition: left 1s ease;
            z-index: 10;
            border-radius: 2px;
        }

        .advice-box {
            background: #f8fafc;
            padding: 20px;
            border-radius: 12px;
            border-left: 5px solid var(--primary);
        }

        .advice-item {
            margin-bottom: 10px;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="card">
            <h2>🩺 Nhập thông tin</h2>
            <div class="form-group">
                <label>Giới tính</label>
                <select id="gender">
                    <option value="male">Nam</option>
                    <option value="female">Nữ</option>
                </select>
            </div>
            <div class="form-group">
                <label>Tuổi</label>
                <input type="number" id="age" value="16">
            </div>
            <div class="form-group">
                <label>Chiều cao (cm)</label>
                <input type="number" id="height" placeholder="VD: 170">
            </div>
            <div class="form-group">
                <label>Cân nặng (kg)</label>
                <input type="number" id="weight" placeholder="VD: 60">
            </div>
            <div class="form-group">
                <label>Mức độ vận động</label>
                <select id="activity">
                    <option value="1.2">Ít vận động (Đi học, ngồi nhiều)</option>
                    <option value="1.375">Nhẹ (Thể dục 1-3 ngày/tuần)</option>
                    <option value="1.55">Vừa (Thể dục 3-5 ngày/tuần)</option>
                    <option value="1.725">Năng động (Thể dục 6-7 ngày/tuần)</option>
                </select>
            </div>
            <button class="btn-check" onclick="calculate()">KIỂM TRA SỨC KHỎE</button>
        </div>

        <div class="card">
            <h2>📊 Kết quả phân tích</h2>

            <div class="result-metric">
                <div class="bmi-value" id="bmiVal">--</div>
                <div class="bmi-label">Chỉ số BMI</div>
                <div id="bmiStatus" class="status-badge" style="background: #94a3b8;">Chưa có dữ liệu</div>
            </div>

            <div class="gauge-container">
                <!-- 0-18.5 (18.5), 18.5-23 (4.5), 23-30 (7), >30 -->
                <!-- Scale 0 to 40 for simplicity visually -->
                <div style="position: absolute; width: 46%; background: #60a5fa; height: 100%; left: 0;"
                    title="Nhẹ cân"></div>
                <div style="position: absolute; width: 11%; background: #22c55e; height: 100%; left: 46%;"
                    title="Bình thường"></div>
                <div style="position: absolute; width: 18%; background: #eab308; height: 100%; left: 57%;"
                    title="Thừa cân"></div>
                <div style="position: absolute; width: 25%; background: #ef4444; height: 100%; left: 75%;"
                    title="Béo phì"></div>
                <div id="marker" class="marker" style="left: 0; opacity: 0;"></div>
            </div>
            <div style="display: flex; justify-content: space-between; font-size: 0.8rem; color: #64748b;">
                <span>0</span>
                <span>18.5</span>
                <span>23</span>
                <span>30+</span>
            </div>

            <div class="advice-box" style="margin-top: 20px;">
                <h4>🔥 Nhu cầu năng lượng</h4>
                <div class="advice-item">BMR (Năng lượng nghỉ): <b id="bmrVal">--</b> Calo/ngày</div>
                <div class="advice-item">TDEE (Cần thiết để giữ cân): <b id="tdeeVal"
                        style="color: var(--primary); font-size: 1.2rem;">--</b> Calo/ngày</div>
            </div>
        </div>
    </div>

    <script>
        function calculate() {
            // Input
            const h_cm = parseFloat(document.getElementById('height').value);
            const w = parseFloat(document.getElementById('weight').value);
            const age = parseInt(document.getElementById('age').value);
            const gender = document.getElementById('gender').value;
            const act = parseFloat(document.getElementById('activity').value);

            if (!h_cm || !w) { alert("Vui lòng nhập chiều cao và cân nặng!"); return; }

            const h_m = h_cm / 100;

            // 1. BMI Calculation
            let bmi = w / (h_m * h_m);
            bmi = Math.round(bmi * 10) / 10;

            document.getElementById('bmiVal').innerText = bmi;

            // Status & Color
            let status = "";
            let color = "";
            let pos = 0; // percentage position 0-100 mapped to 0-40 scale

            // Scale mapping: 0-40 BMI range maps to 0-100% width
            // 18.5 BMI -> 46%
            // 23 BMI -> 57%
            // 30 BMI -> 75%

            let visualBMI = Math.min(Math.max(bmi, 0), 40);
            let leftPercent = (visualBMI / 40) * 100;

            if (bmi < 18.5) { status = "Nhẹ cân"; color = "#60a5fa"; }
            else if (bmi < 23) { status = "Bình thường"; color = "#22c55e"; }
            else if (bmi < 25) { status = "Thừa cân"; color = "#eab308"; }
            else { status = "Béo phì"; color = "#ef4444"; }

            const badge = document.getElementById('bmiStatus');
            badge.innerText = status;
            badge.style.background = color;

            // Marker animation
            const marker = document.getElementById('marker');
            marker.style.opacity = 1;
            marker.style.left = leftPercent + "%";

            // 2. BMR Calculation (Mifflin-St Jeor)
            let s = (gender === 'male') ? 5 : -161;
            let bmr = (10 * w) + (6.25 * h_cm) - (5 * age) + s;
            bmr = Math.round(bmr);

            // 3. TDEE
            let tdee = Math.round(bmr * act);

            document.getElementById('bmrVal').innerText = bmr.toLocaleString();
            document.getElementById('tdeeVal').innerText = tdee.toLocaleString();
        }
    </script>

</body>

</html>
