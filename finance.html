<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinanceSim - Tài Chính Thông Minh</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #ca8a04;
            /* Gold 600 */
            --primary-dark: #a16207;
            --secondary: #15803d;
            /* Green 700 */
            --bg: #fafaf9;
            /* Warm grey */
            --card: #ffffff;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg);
            color: #1c1917;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .main-container {
            width: 100%;
            max-width: 1000px;
            background: var(--card);
            border-radius: 20px;
            box-shadow: 0 20px 40px -5px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: grid;
            grid-template-columns: 350px 1fr;
        }

        .sidebar {
            background: #1c1917;
            color: white;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.05);
            border: none;
            padding: 15px;
            border-radius: 12px;
            color: #a8a29e;
            text-align: left;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .tab-btn:hover,
        .tab-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 10px rgba(202, 138, 4, 0.3);
        }

        .content {
            padding: 30px;
            overflow-y: auto;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--secondary);
            margin-bottom: 20px;
            border-bottom: 2px solid #e7e5e4;
            padding-bottom: 10px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 5px;
            color: #57534e;
        }

        input {
            width: 100%;
            padding: 10px 15px;
            border: 2px solid #e7e5e4;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--primary);
            outline: none;
        }

        .btn-calc {
            width: 100%;
            padding: 15px;
            background: var(--secondary);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            font-size: 1.1rem;
            transition: 0.3s;
        }

        .btn-calc:hover {
            background: #166534;
        }

        .result-box {
            background: #ecfccb;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
            color: #365314;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        .big-number {
            font-size: 2rem;
            font-weight: 800;
            color: var(--secondary);
        }

        canvas {
            margin-top: 30px;
            max-height: 300px;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 768px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="main-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="logo">💰 FinanceSim</div>
            <button class="tab-btn active" onclick="switchTab('savings')">📈 Gửi Tiết Kiệm (Savings)</button>
            <button class="tab-btn" onclick="switchTab('loan')">🏦 Vay Trả Góp (Loan)</button>
        </div>

        <!-- Savings Content -->
        <div id="savings-tab" class="content">
            <div class="section-title">Tính Lãi Suất Kép (Tích sản)</div>
            <div class="form-grid">
                <div>
                    <label>Vốn ban đầu (VNĐ)</label>
                    <input type="number" id="s_initial" value="0">
                </div>
                <div>
                    <label>Gửi hàng tháng (VNĐ)</label>
                    <input type="number" id="s_monthly" value="1000000">
                </div>
                <div>
                    <label>Lãi suất (%/năm)</label>
                    <input type="number" id="s_rate" value="6.5">
                </div>
                <div>
                    <label>Thời gian (Năm)</label>
                    <input type="number" id="s_years" value="10">
                </div>
            </div>
            <button class="btn-calc" onclick="calcSavings()">Tính Toán Tương Lai</button>

            <div class="result-box">
                <div class="result-row"><span>Tổng tiền gốc đã đóng:</span> <b id="s_total_principal">--</b></div>
                <div class="result-row"><span>Tổng tiền lãi nhận được:</span> <b id="s_total_interest">--</b></div>
                <hr>
                <div class="result-row">
                    <span>TỔNG TÀI SẢN:</span>
                </div>
                <div class="big-number" id="s_final_amount">--</div>
            </div>

            <canvas id="savingsChart"></canvas>
        </div>

        <!-- Loan Content -->
        <div id="loan-tab" class="content hidden">
            <div class="section-title">Vay Mua Nhà / Xe (Trả góp)</div>
            <div class="form-grid">
                <div>
                    <label>Số tiền vay (VNĐ)</label>
                    <input type="number" id="l_amount" value="500000000">
                </div>
                <div>
                    <label>Lãi suất vay (%/năm)</label>
                    <input type="number" id="l_rate" value="10">
                </div>
                <div>
                    <label>Thời hạn vay (Năm)</label>
                    <input type="number" id="l_years" value="5">
                </div>
            </div>
            <button class="btn-calc" style="background: var(--primary);" onclick="calcLoan()">Tính Lịch Trả Nợ</button>

            <div class="result-box" style="background: #fef9c3; color: #713f12;">
                <div class="result-row"><span>Trả hàng tháng (EMI):</span> <b id="l_monthly">--</b></div>
                <div class="result-row"><span>Tổng lãi phải trả:</span> <b id="l_total_interest">--</b></div>
                <hr>
                <div class="result-row">
                    <span>TỔNG TIỀN PHẢI TRẢ:</span>
                </div>
                <div class="big-number" id="l_total" style="color: var(--primary-dark);">--</div>
            </div>

            <canvas id="loanChart"></canvas>
        </div>
    </div>

    <script>
        let myChart = null;

        function switchTab(tab) {
            document.getElementById('savings-tab').classList.add('hidden');
            document.getElementById('loan-tab').classList.add('hidden');
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

            document.getElementById(tab + '-tab').classList.remove('hidden');
            event.target.classList.add('active');
        }

        function formatMoney(num) {
            return num.toLocaleString('vi-VN') + ' đ';
        }

        function calcSavings() {
            // Inputs
            const initial = parseFloat(document.getElementById('s_initial').value) || 0;
            const monthly = parseFloat(document.getElementById('s_monthly').value) || 0;
            const rateYear = parseFloat(document.getElementById('s_rate').value) || 0;
            const years = parseFloat(document.getElementById('s_years').value) || 0;

            const months = years * 12;
            const r_month = rateYear / 100 / 12;

            let labels = [];
            let dataPrincipal = [];
            let dataInterest = [];

            let currentBalance = initial;
            let totalPrincipal = initial;

            for (let i = 1; i <= months; i++) {
                // Interest first
                let interest = currentBalance * r_month;
                currentBalance += interest + monthly;
                totalPrincipal += monthly;

                // Record data yearly
                if (i % 12 === 0) {
                    labels.push("Năm " + (i / 12));
                    dataPrincipal.push(totalPrincipal);
                    dataInterest.push(currentBalance - totalPrincipal);
                }
            }

            document.getElementById('s_total_principal').innerText = formatMoney(Math.round(totalPrincipal));
            document.getElementById('s_total_interest').innerText = formatMoney(Math.round(currentBalance - totalPrincipal));
            document.getElementById('s_final_amount').innerText = formatMoney(Math.round(currentBalance));

            drawChart('savingsChart', labels, dataPrincipal, dataInterest, 'Tiền Gốc', 'Tiền Lãi');
        }

        function calcLoan() {
            const amount = parseFloat(document.getElementById('l_amount').value) || 0;
            const rateYear = parseFloat(document.getElementById('l_rate').value) || 0;
            const years = parseFloat(document.getElementById('l_years').value) || 0;

            const months = years * 12;
            const r_month = rateYear / 100 / 12;

            // EMI Formula: P * r * (1+r)^n / ((1+r)^n - 1)
            const emi = (amount * r_month * Math.pow(1 + r_month, months)) / (Math.pow(1 + r_month, months) - 1);
            const totalPay = emi * months;
            const totalInterest = totalPay - amount;

            document.getElementById('l_monthly').innerText = formatMoney(Math.round(emi));
            document.getElementById('l_total_interest').innerText = formatMoney(Math.round(totalInterest));
            document.getElementById('l_total').innerText = formatMoney(Math.round(totalPay));

            // Chart: Loan Balance over time
            let labels = [];
            let dataBalance = [];
            let balance = amount;

            for (let i = 1; i <= months; i++) {
                let interest = balance * r_month;
                let principal = emi - interest;
                balance -= principal;
                if (balance < 0) balance = 0;

                if (i % 12 === 0) {
                    labels.push("Năm " + (i / 12));
                    dataBalance.push(balance);
                }
            }
            // Force start point
            labels.unshift("Năm 0");
            dataBalance.unshift(amount);

            // Draw Line Chart for Loan Balance
            const ctx = document.getElementById('loanChart').getContext('2d');
            if (myChart) myChart.destroy();

            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Dư nợ còn lại (VNĐ)',
                        data: dataBalance,
                        borderColor: '#ca8a04',
                        backgroundColor: 'rgba(202, 138, 4, 0.1)',
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        title: { display: true, text: 'Biểu đồ Giảm dần Dư nợ' }
                    }
                }
            });
        }

        function drawChart(canvasId, labels, data1, data2, label1, label2) {
            const ctx = document.getElementById(canvasId).getContext('2d');
            if (myChart) myChart.destroy();

            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: label1,
                            data: data1,
                            backgroundColor: '#15803d',
                        },
                        {
                            label: label2,
                            data: data2,
                            backgroundColor: '#ca8a04',
                        }
                    ]
                },
                options: {
                    responsive: true,
                    scales: {
                        x: { stacked: true },
                        y: { stacked: true }
                    },
                    plugins: {
                        title: { display: true, text: 'Tăng trưởng Tài sản qua các năm' }
                    }
                }
            });
        }

        // Auto calc on load
        calcSavings();
    </script>

</body>

</html>
