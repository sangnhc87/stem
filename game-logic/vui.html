<!DOCTYPE html>
<html>
<head>
  <title>Sơ đồ giao lộ</title>
</head>
<body>
<canvas id="graphCanvas" width="500" height="400" style="border:1px solid #000;"></canvas>
<script>
const canvas = document.getElementById('graphCanvas');
const ctx = canvas.getContext('2d');

// Vị trí các đỉnh
const points = {
  A: {x: 250, y: 50},
  B: {x: 150, y: 150},
  C: {x: 350, y: 150},
  D: {x: 150, y: 250},
  E: {x: 350, y: 250}
};

// Vẽ các cạnh với trọng số
const edges = [
  ['A','B',1], ['A','C',2],
  ['B','C',4], ['B','D',5],
  ['C','E',10], ['D','E',6]
];

ctx.font = '16px Arial';
ctx.textAlign = 'center';
ctx.textBaseline = 'middle';

// Vẽ cạnh
edges.forEach(([p1,p2,w]) => {
  const {x:x1,y:y1} = points[p1];
  const {x:x2,y:y2} = points[p2];
  ctx.beginPath();
  ctx.moveTo(x1,y1);
  ctx.lineTo(x2,y2);
  ctx.stroke();
  // Vẽ trọng số ở giữa cạnh
  const midX = (x1+x2)/2;
  const midY = (y1+y2)/2;
  ctx.fillText(w, midX, midY);
});

// Vẽ các đỉnh
for (let p in points) {
  const {x,y} = points[p];
  ctx.beginPath();
  ctx.arc(x,y,20,0,Math.PI*2);
  ctx.fillStyle = '#fff';
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#000';
  ctx.fillText(p,x,y);
}
</script>
</body>
</html>
